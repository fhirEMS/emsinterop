[project]
name = "nemsis2fhir"
version = "0.1.0"
description = "NEMSIS v3.5 ePCR XML -> IHE-conformant FHIR R4 (mPSC / US Core) translation engine, loading into fhirEngine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "FHIRmedic (Chad)" }]
dependencies = [
    "lxml>=5.0",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
bronze = ["deltalake>=0.17", "pyarrow>=17"]
analytics = ["duckdb>=1.0"]
dev = ["pytest>=8.0", "openpyxl>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nemsis2fhir.terminology" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
